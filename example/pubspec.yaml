name: example
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  ansi_escape_codes: ^3.1.2
  flutter:
    sdk: flutter
  flutter_team_logger:
    path: ../
  share_plus: ^10.1.0
  stack_trace: ^1.12.1
  team_logger: ^0.4.0
  window_manager: ^0.5.1

# Until team_logger 0.4.0 (file storage) is published.
dependency_overrides:
  team_logger:
    path: ../../team_logger

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
